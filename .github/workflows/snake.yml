name: Draw the contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render the navy, blue and crimson snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#247bff&color_dots=#070b16,#10192a,#18335e,#1e59b0,#247bff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff354f&color_dots=#070b16,#201321,#472033,#8c2945,#ff354f

      - name: Publish self-contained SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
